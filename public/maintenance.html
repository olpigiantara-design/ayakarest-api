<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Under Maintenance — AYAKA API</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .maintenance-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .maintenance-card {
      background: var(--white);
      border: var(--border);
      box-shadow: 10px 10px 0 var(--black);
      border-radius: var(--radius);
      padding: 60px 40px;
      max-width: 600px;
    }
    .maintenance-card h1 { font-size: 36px; margin-bottom: 16px; font-weight: 900; }
    .maintenance-card p { color: #555; font-size: 16px; margin-bottom: 32px; }
  </style>
</head>
<body>
  <div class="maintenance-wrap">
    <div class="maintenance-card">
      <div class="logo" style="font-size:32px; margin-bottom:24px;">AYAKA<span>API</span></div>
      <h1>SYSTEM MAINTENANCE</h1>
      <p>Maaf, AYAKA API saat ini sedang dalam pemeliharaan sistem. Silakan kembali beberapa saat lagi.</p>
      <a href="/admin" class="btn btn-primary">ADMIN ACCESS</a>
    </div>
  </div>
</body>
</html>
