<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Register — AYAKA API</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo" style="font-size:28px; margin-bottom:16px;">AYAKA<span>API</span></div>
        <h1>Create Account</h1>
        <p>Bergabung dengan ekosistem AYAKA API.</p>
      </div>
      
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="johndoe" required>
        </div>
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Min. 8 chars, 1 uppercase, 1 number" required>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Ulangi password" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width:100%; padding:16px; font-size:16px;">REGISTER</button>
      </form>
      
      <div class="auth-footer">
        Sudah punya akun? <a href="/login">Login di sini</a>
      </div>
    </div>
  </div>
  
  <script src="/js/auth.js"></script>
</body>
</html>
