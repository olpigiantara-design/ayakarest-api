<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login — AYAKA API</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo" style="font-size:28px; margin-bottom:16px;">AYAKA<span>API</span></div>
        <h1>Welcome Back</h1>
        <p>Login ke dashboard AYAKA Sync Anda.</p>
      </div>
      
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        
        <div class="auth-actions">
          <label class="checkbox-group">
            <input type="checkbox" name="remember">
            <span>Remember Me</span>
          </label>
          <a href="#" style="font-weight:700; text-decoration:underline;">Forgot Password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width:100%; padding:16px; font-size:16px;">LOGIN</button>
      </form>
      
      <div class="auth-footer">
        Belum punya akun? <a href="/register">Daftar sekarang</a>
      </div>
    </div>
  </div>
  
  <script src="/js/auth.js"></script>
</body>
</html>
